# tmd 目标列表示例(targets.yaml)
#
# 放置位置:
#   1. --targets <路径> 显式指定
#   2. $TMD_CONFIG_DIR/targets.yaml   ← 默认
#   3. $HOME/.tmd2/targets.yaml
#
# ---------------------------------------------------------------
# ⚠️ 本文件是【提案中的示例】,当前版本尚未实现,现在写它不会生效。
#    目前请用命令行参数: tmd --user 44196397 --user @elonmusk
# ---------------------------------------------------------------
#
# 有了这个文件之后,就不必每次把一长串 ID 敲在命令行上。
# 程序会按顺序逐个处理,【其中任何一个失败都不会中断其余的】——
# 账号被封/注销/受保护时会被跳过,并记录到 targets_report.tsv。
#
# 写法:每个条目可以是 @handle,也可以是纯数字 ID。
#   - 带 @ 的 handle 请【加引号】
#   - 纯数字 ID 建议【不加引号】,表示"这是账号 ID"而非名字
#   - 不带 @ 的字母串按 handle 处理
#   - 数字字符串(如 "44196397")也按 ID 处理,所以引号与否不影响语义

users:
  - 44196397          # 数字 ID,推荐 —— 账号改名也不会找错人
  - "@elonmusk"       # handle,需加引号

  # ---- 下面这些是"坏账号"的示例,用来展示跳过行为 ----
  # - 1234567890      # 已注销 / 被封禁 → 跳过并记录
  # - "@protected_guy" # 受保护且未关注 → 跳过并记录
  # - "@muted_guy"     # 被你屏蔽或静音 → 跳过并记录

# ---------------------------------------------------------------------------
# 备选写法:显式声明类型。
# 效果一样,但需要严格的 YAML 校验、想避免"YAML 把大写 ON/OFF 当布尔值"
# 这类跨类型坑时更稳妥(引号与否都不再影响语义):
#
# users:
#   - handle: elonmusk
#   - id: 44196397
# ---------------------------------------------------------------------------
