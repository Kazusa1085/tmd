# tmd 配置示例(conf.yaml)
#
# 放置位置(优先级从高到低):
#   1. $TMD_CONFIG_DIR/conf.yaml      ← 推荐,Docker 里挂载外部目录
#   2. $HOME/.tmd2/conf.yaml          ← 默认(Windows 为 %appdata%\.tmd2\)
#
# ---------------------------------------------------------------
# ⚠️ 注意:本文件是【提案中的示例】,里面的 state_path 尚未实现。
#    当前版本可以直接使用的只有 root_path / cookie / max_download_routine
#    这三项;不认识的多余字段会被忽略(不会报错),但也不生效。
# ---------------------------------------------------------------
#
# 也可以不用手写,直接运行 `tmd --conf` 走交互式引导生成。

# 媒体文件的存放根目录。必填,可以是还不存在的路径。
#   - Docker 里建议挂载成 /data
#   - 强烈建议用【绝对路径】。手写相对路径不会被转成绝对路径,
#     会随当前工作目录漂移,导致媒体散落到不同地方。
root_path: /data

# 程序自身状态(SQLite 库 + 失败重试队列)的存放目录。
# 不填则默认 <root_path>/.data,与媒体混在一起。
#
# 【建议单独指定到本地卷】原因:SQLite 依赖可靠的文件锁,
# 在网络共享(NFS/SMB/CIFS)上会出错甚至损坏数据库。
# 媒体可以放网络共享,但这个目录不要放。
# state_path: /state

# 登录凭据。获取方式见 doc/help.md
cookie:
  auth_token: "在这里填入 auth_token"
  ct0: "在这里填入 ct0"

# 最大并发下载协程数。填 0 或不填则自动取值:
#   min(100, CPU核数 * 10)
# 【Docker/NAS 提醒】SQLite 是单写者,并发过高只会互相等锁,
# 实际吞吐不会变好。给 8~16 通常就够了。
max_download_routine: 8
